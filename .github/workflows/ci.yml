name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, format, typecheck, test og build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hele historikken: verify-counts.sh kontrollerer at hver PR-rad ført
          # som «merget» i §74.2 har sin commit. En grunn klone ville gjort hver
          # rad til et avvik, og kontrollen sier fra framfor å slå seg av.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatkontroll
        run: npm run format:check
      - name: Tallpåstander i styringsdokumentene
        run: ./scripts/verify-counts.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Tester
        run: npm run test
      - name: Produksjonsbygg
        run: npm run build

  database:
    name: Migrasjoner og databasetester på lokal Supabase-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      - name: Start lokal Supabase-stack
        run: npx supabase start
      - name: Kjør migrasjonene fra bunnen av
        run: npx supabase db reset
      - name: Databasetester (pgTAP)
        run: npm run db:test
      # pgTAP-filene kjører i én transaksjon som rulles tilbake, og kan derfor
      # ikke prøve hva som skjer *mellom* to transaksjoner. Denne kjører to
      # reelle forbindelser mot hverandre og kontrollerer at kontrollen av «det
      # du faktisk så» holder revisjonslåsen (migrasjon 006f).
      - name: Samtidighetsprøve (to forbindelser)
        run: npm run db:test:lock
      - name: Stopp stacken
        if: always()
        run: npx supabase stop
