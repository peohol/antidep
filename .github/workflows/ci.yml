name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, format, typecheck, test og build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      # Leserekkefølgen fra en tospaltet PDF er prøvd mot det **ekte** verktøyet
      # (src/agents/reading-order.test.ts). En prøve mot en håndskrevet
      # XML-fil kunne vært grønn mens kjeden var rød, fordi regelen gjelder
      # Popplers faktiske utdata. Testpakken krever derfor poppler.
      - name: Installer poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Lint
        run: npm run lint
      - name: Formatkontroll
        run: npm run format:check
      - name: Repository invariants
        run: npm run verify:repo
      - name: Typecheck
        run: npm run typecheck
      - name: Tester
        run: npm run test
      - name: Produksjonsbygg
        run: npm run build

  database:
    name: Migrasjoner og databasetester på lokal Supabase-stack
    runs-on: ubuntu-latest
    # Oppgraderingsprøvene er den lange delen, og monografiens egen bygger hele
    # kjeden to ganger: én gang for innholdet som skal finnes fra før, og én
    # gang oppå det. Jobben lå på ~11 minutter og ligger nå på ~15 av 20, og en
    # grense så tett på er en flaky jobb som venter på å skje.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      # Tekstuttrekkingen fra PDF er en ekte kjøring av et ekte verktøy, og
      # kjedeprøven går gjennom hele dokumentveien (migrasjon 003e). Uten
      # poppler ville det leddet vært det eneste som aldri ble kjørt i CI.
      - name: Installer poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Start lokal Supabase-stack
        run: npx supabase start
      # Fersk installasjon kan ikke bevise at engangsresetten er trygg på en
      # database som allerede inneholder prototypeinnhold. Denne prøven går
      # tilbake til siste legacy-migrasjon, legger inn syntetisk aktivt innhold
      # og tester både vellykket oppgradering, publiseringsstopp, åpen agentjobb
      # og at migrasjonen ikke kan slette nytt innhold ved en senere omkjøring.
      - name: Oppgraderingsprøve for Antidep 2-reset
        run: npm run db:test:upgrade
      - name: Kjør migrasjonene fra bunnen av
        if: always()
        run: npx supabase db reset
      - name: Databasetester (pgTAP)
        run: npm run db:test
      # pgTAP-filene kjører i én transaksjon som rulles tilbake, og kan derfor
      # ikke prøve hva som skjer *mellom* to transaksjoner. Denne kjører to
      # reelle forbindelser mot hverandre og kontrollerer at kontrollen av «det
      # du faktisk så» holder revisjonslåsen (migrasjon 006f).
      - name: Samtidighetsprøve (to forbindelser)
        if: always()
        run: npm run db:test:lock
      # Kvoten på rå diagnostikk er «tell, og sett inn hvis tallet er lavt
      # nok» — et kappløp som bare finnes mellom transaksjoner, og som pgTAP
      # derfor ikke kan se. Denne kjører mange forbindelser mot hverandre og
      # kontrollerer at radlåsen faktisk holder grensen.
      - name: Samtidighetsprøve for diagnostikk-kvoten
        if: always()
        run: npm run db:test:quota
      # Enhetsprøvene dekker hver sin halvdel: nettleseren sender, og ruten
      # videresender. Denne går hele veien med den ekte serverruten, den ekte
      # Data API-en og den ekte databasen, og leser resultatet med psql — altså
      # utenom enhver leservei appen har (issue #99, punkt 8).
      - name: Ende-til-ende for diagnostikkveien (rute til faktisk lagring)
        if: always()
        run: npm run db:test:diagnostics
      # pgTAP prøver SQL, og vitest prøver TypeScript med doble for databasen.
      # Grensen mellom dem — at parameternavnene agentporten sender, er nøyaktig
      # de api-funksjonene tar imot — er ikke prøvd av noen av dem. Denne kjører
      # de ekte kjørerne mot den ekte stacken fram til et dokumentbundet
      # EvidenceItem med uavhengig maskinkontroll. Publisering prøves ikke her.
      - name: Kjedeprøve (ekte kjørere mot ekte database)
        if: always()
        run: npm run db:test:chain
      # Den autonome kjøreren prøves som det den er: et protokollendepunkt med
      # ekte OAuth og den ekte databasen bak. Ingen modell kalles og ingen
      # nøkkel finnes — «agenten» er prøven selv, og svaret settes sammen av
      # oppgaven databasen bygget. En prøve som hadde kontaktet ChatGPT, ville
      # gjort CI avhengig av en ekstern tjeneste og en betalt konto.
      - name: Ende-til-ende for den autonome kjøreren (MCP mot ekte database)
        if: always()
        run: npm run db:test:mcp
      # De to flatene der et menneske gjør noe for at kjeden skal gå videre:
      # å be om artikkelen, og å velge riktig PDF. Resten — bindingen,
      # lesbarhetskontrollen, det registrerte tekstuttrekket, registreringen og
      # kølegging av neste ledd — er Antideps eget arbeid. Denne kjøringen går
      # hele veien med en ekte PDF og det ekte pdftotext, gjennom de ekte
      # api-funksjonene (issue #99, issue #101). Selve kjedeovergangene er
      # databasens egne og prøves i supabase/tests/810_chain_transitions_test.sql.
      - name: Ende-til-ende for fulltekstveien (bestilling til kølagt arbeid)
        if: always()
        run: npm run db:test:intake
      # Den tredje redaksjonelle handlingen: å avgjøre om ny forskning skal inn i
      # en påstand Antidep allerede har. Selve tilstanden og kjeden prøves i
      # supabase/tests/830_claim_revision_review_test.sql; her går forløpet over
      # den ekte Data API-en, med de ekte leserne i src/lib/claim-revision.ts —
      # så et feltnavn som skiftet i SQL-en, ikke kan gå gjennom hver eneste
      # enhetsprøve og først bli synlig i produksjon (migrasjon 012d).
      - name: Ende-til-ende for revisjonsveien (ny forskning til ny kandidat)
        if: always()
        run: npm run db:test:revision
      # Kjedens «finn eller opprett»-steder — synteseoppgaven, kilden bak en
      # fulltekstbestilling og den redaksjonelle revisjonsoppgaven — er kappløp
      # som ingen unikhetskrav fanger, fordi radene de to øktene skriver, ikke er
      # like nok til å kollidere. Det samme gjelder en redaksjonell beslutning
      # tatt mens grunnlaget endrer seg under den. Denne kjører øktene mot
      # hverandre (migrasjon 012b, 012c, 012d).
      #
      # Den står sist med vilje. Prøven bestiller og laster ikke opp, og selv om
      # den rydder opp etter seg, er den den eneste kjøringen her som med vilje
      # legger igjen halvferdig arbeid i køen mens den står på. Prøvene som leser
      # *hele* den åpne arbeidsoversikten, skal se stacken slik de selv etterlot
      # den.
      - name: Samtidighetsprøve for kjedeovergangene
        if: always()
        run: npm run db:test:race
      - name: Stopp stacken
        if: always()
        run: npx supabase stop
