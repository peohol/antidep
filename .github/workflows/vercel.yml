# Produksjonsdeploy til Vercel.
#
# ----------------------------------------------------------------------------
# Hvorfor denne ikke kjører på pull requests
#
# `VERCEL_TOKEN` ligger i jobbens miljø, og jobben sjekker ut koden og kjører
# `vercel build` — altså byggskriptene fra branchen. En pull request fra en
# branch i samme repo kan få repository-secrets. Kode på en PR-branch skal
# derfor ikke få en produksjonsdeploy-token tilgjengelig.
#
# Dette er en minste-privilegium-grense for samme trusselmodell som agentene
# bruker: kode og modellledd som behandler eksternt innhold skal ikke samtidig
# få unødvendige skrivekapable hemmeligheter eller verktøy. Se AGENTS.md og
# ANTIDEP_CONSTITUTION.md regel 7.
#
# Forhåndsvisninger forsvinner ikke av det. Vercels egen Git-integrasjon deployer
# hver branch og hver pull request selv, og det er den som gir lenken i
# PR-kommentaren. Denne arbeidsflyten skal bare produsere produksjonsdeploy fra
# reviewet kode på `main`.
# ----------------------------------------------------------------------------

name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
