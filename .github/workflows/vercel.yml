# Produksjonsdeploy til Vercel.
#
# ----------------------------------------------------------------------------
# Hvorfor denne ikke kjører på pull requests lenger
#
# `VERCEL_TOKEN` ligger i jobbens miljø, og jobben sjekker ut den utsjekkede
# koden og kjører `vercel build` — altså byggskriptene fra den branchen. En pull
# request fra en branch i *samme* repo får repository-secrets, i motsetning til
# en fra en fork. Kode på en PR-branch kunne derfor kjøre med deploy-tokenet
# tilgjengelig.
#
# Det var en åpen eskaleringsvei for enhver aktør med pushetilgang, og en aktør
# som leser eksternt kildemateriale, skal ikke ha den (EVIDENCE_PIPELINE.md §63,
# docs/ROUTINE_EXTRACTION.md §3.5). En instruks om «ikke push» er ingen grense
# når poenget er å tåle promptinjeksjon; veien måtte stenges der den fantes.
#
# Forhåndsvisninger forsvinner ikke av det. Vercels egen Git-integrasjon deployer
# hver branch og hver pull request selv, og det er den som gir lenken i
# PR-kommentaren (`antidep-git-<branch>-…`). Denne arbeidsflyten laget en *andre*
# deploy av det samme, uten branch-alias — se `README.md`.
#
# Produksjonsdeployen står igjen: den kjører bare på `main`, som er kode noen har
# reviewet og merget.
# ----------------------------------------------------------------------------

name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
