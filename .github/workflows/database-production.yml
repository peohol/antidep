name: Produksjonsmigrasjoner

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database-production.yml'

permissions:
  contents: read

concurrency:
  group: antidep-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Bruk nye migrasjoner i produksjon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: gxorhbwndpopartjuwbj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installerer den Supabase CLI-versjonen som allerede er låst i repoet.
      # Produksjonstokenet er med vilje ikke tilgjengelig i dette steget.
      - name: Installer avhengigheter
        run: npm ci

      - name: Kontroller at produksjonstokenet finnes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::GitHub-secret SUPABASE_ACCESS_TOKEN mangler.'
            exit 1
          fi

      # `link` kan bruke Supabase CLI sin passordlose CI-flyt. En tom linje
      # svarer eksplisitt pa det valgfrie databasepassordet dersom CLI-en spor.
      - name: Koble til produksjonsprosjektet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: printf '\n' | npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Dry-run skal feile for samme ting som den virkelige pushen, men uten a
      # endre databasen. Seed-data sendes aldri til produksjon.
      - name: Forhandsvis migrasjonene
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase --yes db push --linked --dry-run

      - name: Bruk migrasjonene
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase --yes db push --linked
